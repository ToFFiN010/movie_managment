version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cineprime_postgres
    environment:
      POSTGRES_DB: cineprime_db
      POSTGRES_USER: cineprime_user
      POSTGRES_PASSWORD: cineprime_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineprime_user -d cineprime_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cineprime_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cineprime_web
    command: gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=prod-super-secret-key-cineprime-12345
      - ALLOWED_HOSTS=localhost,127.0.0.1,web,nginx
      - USE_REDIS=True
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgres://cineprime_user:cineprime_secure_password@postgres:5432/cineprime_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery_worker:
    build: .
    container_name: cineprime_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=prod-super-secret-key-cineprime-12345
      - USE_REDIS=True
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgres://cineprime_user:cineprime_secure_password@postgres:5432/cineprime_db
    depends_on:
      - web
      - redis
      - postgres

  celery_beat:
    build: .
    container_name: cineprime_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - SECRET_KEY=prod-super-secret-key-cineprime-12345
      - USE_REDIS=True
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgres://cineprime_user:cineprime_secure_password@postgres:5432/cineprime_db
    depends_on:
      - web
      - redis
      - postgres

  nginx:
    image: nginx:1.25-alpine
    container_name: cineprime_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
