{% extends 'base.html' %}

{% block title %}Password Changed — CinePrime Cinemas{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card text-center">
        <div class="mb-3">
            <i class="fa-solid fa-circle-check auth-header-icon" style="color: #22C55E;" aria-hidden="true"></i>
            <h1 class="auth-title">Password Reset Complete</h1>
            <p class="auth-subtitle">Your password has been set successfully. You can now sign in with your new credentials.</p>
        </div>

        <div class="mt-4 pt-2 border-top border-secondary border-opacity-25">
            <a href="{% url 'accounts:login' %}" class="btn-auth-submit text-decoration-none">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
